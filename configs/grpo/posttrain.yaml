# Main post-training policy: independently sample the query and the bundled
# document slate, then evaluate their G x G cross product.
action_components:
  - [query]
  - [positive, negative]
group_size: 32
kappa: 755
sigma_learnable: false
advantage_norm: none
sampling_law: vmf
rollout: product
gradient_estimator: score_function # See docs/gradient_estimators.md.
frozen_doc_rescale: true
advantage_baseline: leave_one_out
in_batch_use_sampled_documents: false
kl_coef: 0
document_log_prob_reduction: sum
target_alignment: null
final_alignment: null
exploration_schedule: fixed
