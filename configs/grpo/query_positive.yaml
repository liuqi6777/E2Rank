# A6 -- query + positive only: sample exactly the axes a binary single-positive ranking
# reward is a function of; negatives stay frozen anchors and receive no direct gradient.
action_components:
  - [query]
  - [positive]
group_size: 32
kappa: 755
sigma_learnable: false
advantage_norm: per_component
sampling_law: vmf
rollout: product
frozen_doc_rescale: true
advantage_baseline: group
