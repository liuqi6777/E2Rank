# Generic query/document product policy. Paper runs use posttrain.yaml.
action_components:
  - [query]
  - [positive, negative]
group_size: 32
kappa: 755
sigma_learnable: false
advantage_norm: none
sampling_law: vmf
rollout: product
frozen_doc_rescale: true
advantage_baseline: leave_one_out
document_log_prob_reduction: sum
target_alignment: null
final_alignment: null
exploration_schedule: fixed
