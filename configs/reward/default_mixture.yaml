# THE DEFAULT REWARD. Declared a priori from the argument in EXPERIMENT_PLAN.md SS0.2-SS0.3,
# then tested by tab:ablation-reward and tab:ablation-mixture -- not selected from a sweep.
#
# Under binary single-positive labels an exact ranking metric resolves a rollout group into
# at most as many levels as its candidate pool admits, so groups tie and produce no gradient;
# a contrastive reward is continuous and never ties, but it is the surrogate the method exists
# to avoid. The mixture is meant to supply gradient exactly where the ranking term degenerates
# while keeping the ranking term's metric-aligned direction.
#
# normalized_sum is REQUIRED here, not stylistic: under a raw `sum` the effective mixing ratio
# is weight x within-group std, and a bounded nDCG (std ~1e-1) against a temperature-scaled
# InfoNCE margin would collapse to the InfoNCE term alone. mixture_raw_sum.yaml measures that.
#
# Two free parameters, both resolved by experiment rather than assumed:
#   include_negatives  pool 39 (other queries' positives) vs 256 (+ their mined negatives).
#                      Decided in phase1_pilot.sh on reward/<term>/n_distinct: the larger pool
#                      only helps if it raises the number of REALIZED reward levels.
#   weight of infonce  swept by phaseA_mixture.sh; 0.5 is the provisional value everything
#                      else runs at until that sweep lands.
reward_terms:
  - type: ndcg_in_batch
    weight: 1.0
    k: 16
    include_negatives: false
  - type: infonce
    weight: 0.5
    temperature: 0.03
    in_batch_negatives: true
reward_combine: normalized_sum
