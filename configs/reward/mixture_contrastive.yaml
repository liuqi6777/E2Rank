# M6 -- the same mixture with the OTHER score-based family (the margin form, which drops the
# positive from the partition). Checks that the mixture is about combining a rank-based with a
# continuous family, rather than about InfoNCE in particular.
reward_terms:
  - type: ndcg_in_batch
    weight: 1.0
    k: 16
    include_negatives: false
  - type: contrastive
    weight: 0.5
    temperature: 0.03
    in_batch_negatives: true
reward_combine: normalized_sum
