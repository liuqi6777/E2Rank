# Shared budget for all main post-training objectives.
# The learning rate is provisional until the equal-budget dev calibration lands.
bf16: true
tf32: true
per_device_train_batch_size: 24
gradient_checkpointing: true
gradient_accumulation_steps: 1
learning_rate: 0.0001
warmup_ratio: 0.
lr_scheduler_type: constant
num_train_epochs: 1
logging_strategy: steps
logging_steps: 1
save_strategy: steps
save_steps: 200
overwrite_output_dir: true
remove_unused_columns: false
report_to: wandb
seed: 42

lora_enabled: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0
lora_bias: "none"
