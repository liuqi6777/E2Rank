_base_:
  - ../../rag/base.yaml
# NQ follows the DPR labeled train subset; HotpotQA uses mapped supporting facts.
rag_train_sources: nq,hotpotqa
rag_candidate_manifest: data/rag/candidates/nq_hotpotqa_train.jsonl
# G3 uses the complete prepared training set. There is no held-out tuning split:
# the fixed final checkpoint is evaluated once on the QA test set.
rag_split: full
max_steps: -1
save_steps: 100
overwrite_output_dir: false
report_to: wandb
lora_enabled: false
seed: 42
data_seed: 42
