# Experiment contracts, not HfArgumentParser input. Use scripts/experiments/iclr2027.py.
version: 1
plan: paper/EXPERIMENT_PLAN.md
seed: 42
output_root: checkpoints/iclr2027

# Pending implementations are explicit, source-audited blockers. Remove a requirement
# only with its implementation and corresponding validation; there is no bypass flag.
pending:
  rag_ndcg: "RAG nDCG reward not implemented; source_aware_mrr is not an equivalent substitution"
  rag_selection: "Answer-F1 checkpoint selection needs integration with the training schedule"

profiles:
  G1:
    config: g1.yaml
    dataset_manifest: data/processed/reasonrank_multi/manifest.json
    selection: fixed_budget_final_checkpoint
    final_evaluation: [bright]
    requirements: []
    protocol:
      labels: teacher_grades_3_2_1_0_with_all_known_positives_for_cl
      exclude_sources: [msmarco]
      variable_candidates: true
      positive_selection: retain_all_seeded_in_batch_representative
      positive_selection_seed: 42
      frozen_cross_query_documents: true
      max_steps: null
      learning_rate: null
      eval_steps: null
  G2:
    config: g2.yaml
    dataset_manifest: data/protocols/g2_e2rank.json
    selection: fixed_budget_final_checkpoint
    final_evaluation: [mteb_eng_v2]
    requirements: []
    protocol:
      labels: teacher_grades_3_2_1_0
      max_steps: null          # T in optimizer steps; also declare/record actual examples/tokens.
      learning_rate: null
      eval_steps: null
  G3:
    config: g3.yaml
    dataset_manifest: data/protocols/g3_qa.json
    selection: qa_dev_answer_f1
    final_evaluation: [qa_test_answer_f1, qa_test_retrieval]
    requirements: [rag_selection]
    protocol:
      labels: qa_retrieval_relevance
      candidate_access: supervised_offline_candidates_rl_dynamic_full_corpus
      max_steps: null
      learning_rate: null
      eval_steps: null

# Advisory order only: launch still requires one explicit run ID.
# Round 2 explicitly develops configurations using the first-round BRIGHT results.
execution_stages:
  - name: G1 reference
    runs: [G1-E0]
  - name: G1 round 2 configuration development
    runs: [G1-J-LL-Scaled]
  - name: G1 MRR fixed exploration sweep
    runs: [G1-A-MRRAlign040, G1-A-MRRAlign065, G1-J-RL-MRRSmall, G1-A-MRRAlign090, G1-A-MRRAlign095]
  - name: G1 graded nDCG fixed exploration sweep
    runs: [G1-A-NDCGAlign040, G1-A-NDCGAlign065, G1-A-NDCGAlign090, G1-A-NDCGAlign095]
  - name: G1 binary nDCG fixed exploration sweep
    runs: [G1-A-BinaryNDCGAlign040, G1-A-BinaryNDCGAlign065, G1-A-BinaryNDCGAlign080, G1-A-BinaryNDCGAlign090, G1-A-BinaryNDCGAlign095]
  - name: G1 main comparisons
    runs: [G1-J-LL, G1-J-RL, G1-J-CL, G1-J-RN]
  - name: G1 estimator factorial
    runs: [G1-A-Norm, G1-A-DocMean, G1-A-NormDocMean]
  - name: G1 policy and reward mechanisms
    runs: [G1-A-Paired, G1-A-QPolicy, G1-A-DPolicy, G1-A-Cal, G1-A-Binary]
  - name: G2 initialization and common warm-up
    runs: [G2-D-CL, G2-D-LL, G2-D-RL, G2-W-LL, G2-W-RL, G2-W-CL]
  - name: G1 fixed-index deployment
    runs: [G1-DR]
  - name: G3 answer feedback
    runs: [G3-E0, G3-CL, G3-AnsRL, G3-RetRL]
  - name: Optional exploration and reward diagnostics
    runs: [G1-A-Anneal, G1-A-FixedSmall, G1-A-Gaussion, G1-A-MRR]

runs:
  G1-E0: {group: G1, kind: evaluation, scope: reference}
  G1-J-CL: {group: G1, objective: infonce, scope: joint}
  G1-J-RN: {group: G1, objective: ranknet, scope: joint}
  G1-J-LL: {group: G1, objective: lambdaloss, scope: joint}
  G1-J-RL: {group: G1, objective: rl, scope: joint}
  # Round 2: result-informed development; historical run IDs retain their recipes.
  G1-A-BinaryNDCGAlign040:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: binary, target_alignment: 0.40, final_alignment: null, exploration_schedule: fixed}
  G1-A-BinaryNDCGAlign065:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: binary, target_alignment: 0.65, final_alignment: null, exploration_schedule: fixed}
  G1-A-BinaryNDCGAlign080:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: binary, target_alignment: 0.80, final_alignment: null, exploration_schedule: fixed}
  G1-A-BinaryNDCGAlign090:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: binary, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed}
  G1-A-BinaryNDCGAlign095:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: binary, target_alignment: 0.95, final_alignment: null, exploration_schedule: fixed}
  G1-A-NDCGAlign040:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: graded, target_alignment: 0.40, final_alignment: null, exploration_schedule: fixed}
  G1-A-NDCGAlign065:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: graded, target_alignment: 0.65, final_alignment: null, exploration_schedule: fixed}
  G1-A-NDCGAlign090:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: graded, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed}
  G1-A-NDCGAlign095:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: graded, target_alignment: 0.95, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRAlign040:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRR
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.40, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRAlign065:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRR
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.65, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRAlign090:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRR
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRAlign095:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRR
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.95, final_alignment: null, exploration_schedule: fixed}
  G1-J-RL-MRRSmall:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRR
    overrides:
      reward_type: mrr_in_batch
      relevance_scheme: binary
      target_alignment: 0.80
      final_alignment: null
      exploration_schedule: fixed
  G1-J-LL-Scaled:
    group: G1
    objective: lambdaloss
    scope: joint
    control: G1-J-LL
    overrides:
      lambdaloss_sigma: 33.333333333333336
  G1-A-Norm:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {advantage_baseline: leave_one_out, advantage_norm: per_component, document_log_prob_reduction: sum}
  G1-A-DocMean:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {advantage_baseline: leave_one_out, advantage_norm: none, document_log_prob_reduction: mean}
  G1-A-NormDocMean:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {advantage_baseline: leave_one_out, advantage_norm: per_component, document_log_prob_reduction: mean}
  # Paired optional study, anchored to A_1024(755) rather than the rounded 0.53 example.
  # These two recipes are scoped to the current Qwen3-Embedding-0.6B initialization.
  G1-A-Anneal:
    group: G1
    objective: rl
    scope: joint
    priority: optional
    control: G1-J-RL
    overrides:
      target_alignment: 0.5302373892742263
      final_alignment: 0.80
      exploration_schedule: linear
  G1-A-FixedSmall:
    group: G1
    objective: rl
    scope: joint
    priority: optional
    control: G1-J-RL
    overrides:
      target_alignment: 0.80
      final_alignment: null
      exploration_schedule: fixed
  G1-A-QPolicy:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {action_components: [[query]]}
  G1-A-DPolicy:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {action_components: [[positive, negative]]}
  G1-A-Gaussion:
    priority: optional
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {sampling_law: gaussian}
  G1-A-Binary:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {relevance_scheme: binary}
  G1-A-Paired:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {rollout: diagonal}
  G1-A-Cal:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {frozen_doc_rescale: false}
  G1-A-MRR:
    priority: optional
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary}
  G1-DR:
    group: G1
    objective: rl
    scope: query_only
    control: G1-A-QPolicy
    protocol:
      candidate_access: per_source_dynamic_full_corpus
      retrieval_reward: known_qrels_graded_ndcg_at_10
      unjudged_documents: zero_gain
      document_encoder: frozen_E0_index
    overrides:
      dynamic_retrieval: true
      dynamic_retrieval_k: 20
      frozen_document_index_backend: faiss
      reward_type: ndcg
      reward_terms: ''
      reward_ndcg_k: 10
  G2-D-CL: {group: G2, objective: infonce, scope: joint}
  G2-D-LL: {group: G2, objective: lambdaloss, scope: joint}
  G2-D-RL: {group: G2, objective: rl, scope: joint}
  G2-W-CL: {group: G2, objective: infonce, scope: joint, init_from: G2-D-CL}
  G2-W-LL:
    group: G2
    objective: lambdaloss
    scope: joint
    init_from: G2-D-CL
  G2-W-RL:
    group: G2
    objective: rl
    scope: joint
    init_from: G2-D-CL
  G3-E0: {group: G3, kind: evaluation, scope: reference}
  G3-CL: {group: G3, objective: infonce, scope: query_only}
  G3-RetRL:
    group: G3
    objective: rl
    scope: query_only
    requirements: [rag_ndcg]
    overrides: {rag_retrieval_reward: ndcg}
  G3-AnsRL:
    group: G3
    objective: rl
    scope: query_only
    overrides: {rag_retrieval_reward: answer_f1}
