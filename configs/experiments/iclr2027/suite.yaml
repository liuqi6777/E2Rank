# Experiment contracts, not HfArgumentParser input. Use scripts/experiments/iclr2027.py.
version: 1
plan: paper/EXPERIMENT_PLAN.md
seed: 42 # Default training/data seed; explicit per-run seed repeats override it.
output_root: checkpoints/iclr2027

# Missing generated files are checked as artifact prerequisites, not implementation blockers.
pending: {}

profiles:
  G1:
    config: g1.yaml
    dataset_manifest: data/processed/reasonrank_multi/manifest.json
    selection: fixed_budget_final_checkpoint
    final_evaluation: [bright]
    requirements: []
    protocol:
      labels: teacher_grades_3_2_1_0_with_all_known_positives_for_cl
      exclude_sources: [msmarco]
      variable_candidates: true
      positive_selection: retain_all_seeded_in_batch_representative
      positive_selection_seed: 42
      frozen_cross_query_documents: true
      max_steps: null
      learning_rate: null
      eval_steps: null
  G2:
    config: g2.yaml
    dataset: e2rank
    dataset_manifest: data/protocols/g2_e2rank.json
    datasets:
      bge_m3:
        dataset_manifest: /mnt/tidal-alsh-share2/dataset/liuqi18/datasets/bge-m3-data/manifest.json
        runtime_overrides:
          data_path: /mnt/tidal-alsh-share2/dataset/liuqi18/datasets/bge-m3-data
        protocol:
          training_budget: one_epoch
          max_steps: -1
          eval_steps: 1000
    selection: fixed_budget_final_checkpoint
    final_evaluation: [mteb_eng_v2]
    requirements: []
    protocol:
      labels: pos_index_binary
      training_budget: fixed_steps
      max_steps: null          # T in optimizer steps; also declare/record actual examples/tokens.
      learning_rate: null
      eval_steps: null
  G3:
    config: g3.yaml
    dataset_manifest: data/protocols/g3_qa.json
    selection: fixed_budget_final_checkpoint
    final_evaluation: [qa_test_answer_f1, qa_test_retrieval]
    requirements: []
    protocol:
      labels: preconstructed_binary_passage_qrels_aligned_to_frozen_corpus
      candidate_access: supervised_offline_candidates_rl_dynamic_full_corpus
      max_steps: null
      learning_rate: null
      eval_steps: null

# Advisory order only: launch still requires one explicit run ID.
# Round 2 explicitly develops configurations using the first-round BRIGHT results.
execution_stages:
  - name: G1 selected MRR seed repeats
    runs: [G1-A-MRRAlign090-Seed3407, G1-A-MRRAlign090-Seed2026]
  - name: G1 MRR group-size x alignment grid
    runs: [G1-A-MRRG16Align090, G1-A-MRRG64Align090, G1-A-MRRG16Align080, G1-A-MRRG16Align095, G1-A-MRRG64Align080, G1-A-MRRG64Align095]
  - name: G1 binary supervised control
    runs: [G1-J-LL-Binary-Scaled]
  - name: G1 MRR 0.90 mechanisms
    runs: [G1-A-MRR090-QPolicy, G1-A-MRR090-DPolicy, G1-A-MRR090-Paired, G1-A-MRR090-Cal, G1-A-MRR090-Norm, G1-A-MRR090-DocMean, G1-A-MRR090-NormDocMean]
  - name: G1 reference
    runs: [G1-E0]
  - name: G1 round 2 configuration development
    runs: [G1-J-LL-Scaled]
  - name: G1 MRR fixed exploration sweep
    runs: [G1-A-MRRAlign040, G1-A-MRRAlign065, G1-J-RL-MRRSmall, G1-A-MRRAlign090, G1-A-MRRAlign095]
  - name: G1 graded nDCG fixed exploration sweep
    runs: [G1-A-NDCGAlign040, G1-A-NDCGAlign065, G1-A-NDCGAlign090, G1-A-NDCGAlign095]
  - name: G1 binary nDCG fixed exploration sweep
    runs: [G1-A-BinaryNDCGAlign040, G1-A-BinaryNDCGAlign065, G1-A-BinaryNDCGAlign080, G1-A-BinaryNDCGAlign090, G1-A-BinaryNDCGAlign095]
  - name: G1 main comparisons
    runs: [G1-J-LL, G1-J-RL, G1-J-CL, G1-J-RN]
  - name: G1 estimator factorial
    runs: [G1-A-Norm, G1-A-DocMean, G1-A-NormDocMean]
  - name: G1 policy and reward mechanisms
    runs: [G1-A-Paired, G1-A-QPolicy, G1-A-DPolicy, G1-A-Cal, G1-A-Binary]
  - name: G2 E2Rank CL initialization and common warm-up
    runs: [G2-D-CL, G2-E-CL, G2-W-CL]
  - name: G2 E2Rank RL with fixed MRR recipe
    runs: [G2-E-RL, G2-W-RL, G2-D-RL]
  - name: G2 BGE-M3 CL initialization and common warm-up
    runs: [G2-BGE-D-CL, G2-BGE-E-CL, G2-BGE-W-CL]
  - name: G2 BGE-M3 RL with fixed MRR recipe
    runs: [G2-BGE-E-RL, G2-BGE-W-RL, G2-BGE-D-RL]
  - name: G1 fixed-index deployment
    runs: [G1-DR]
  - name: G3 answer feedback
    runs: [G3-E0, G3-CL, G3-AnsRL, G3-RetRL-MRR, G3-RetRL-NDCG]
  - name: Optional exploration and reward diagnostics
    runs: [G1-A-Anneal, G1-A-FixedSmall, G1-A-Gaussion, G1-A-MRR]

runs:
  # Shared recipe: each seed repeat starts independently from E0 and reuses
  # the same prepared data, including its seed-42 in-batch representatives.
  G1-A-MRRAlign090: &g1_mrr090
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRR
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRAlign090-Seed3407:
    <<: *g1_mrr090
    seed: 3407
    control: G1-A-MRRAlign090
  G1-A-MRRAlign090-Seed2026:
    <<: *g1_mrr090
    seed: 2026
    control: G1-A-MRRAlign090
  # Round 4: narrow interaction grid around the selected MRRAlign090 recipe.
  # The G=32 row reuses MRRSmall / MRRAlign090 / MRRAlign095; only the six
  # off-center cells below require new training.
  G1-A-MRRG16Align080:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, group_size: 16, target_alignment: 0.80, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRG16Align090:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, group_size: 16, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRG16Align095:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, group_size: 16, target_alignment: 0.95, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRG64Align080:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, group_size: 64, target_alignment: 0.80, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRG64Align090:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, group_size: 64, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRG64Align095:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, group_size: 64, target_alignment: 0.95, final_alignment: null, exploration_schedule: fixed}
  # Round 3: reuse MRRAlign090 as the control, initialize every new run from E0.
  G1-J-LL-Binary-Scaled:
    group: G1
    objective: lambdaloss
    scope: joint
    control: G1-J-LL-Scaled
    protocol: {labels: all_known_positives_binary}
    overrides: {relevance_scheme: binary, lambdaloss_sigma: 33.333333333333336}
  G1-A-MRR090-QPolicy:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed, action_components: [[query]]}
  G1-A-MRR090-DPolicy:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed, action_components: [[positive, negative]]}
  G1-A-MRR090-Paired:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed, rollout: diagonal}
  G1-A-MRR090-Cal:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed, frozen_doc_rescale: false}
  G1-A-MRR090-Norm:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed, advantage_norm: per_component}
  G1-A-MRR090-DocMean:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed, document_log_prob_reduction: mean}
  G1-A-MRR090-NormDocMean:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRRAlign090
    protocol: {labels: all_known_positives_binary}
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed, advantage_norm: per_component, document_log_prob_reduction: mean}
  G1-E0: {group: G1, kind: evaluation, scope: reference}
  G1-J-CL: {group: G1, objective: infonce, scope: joint}
  G1-J-RN: {group: G1, objective: ranknet, scope: joint}
  G1-J-LL: {group: G1, objective: lambdaloss, scope: joint}
  G1-J-RL: {group: G1, objective: rl, scope: joint}
  # Round 2: result-informed development; historical run IDs retain their recipes.
  G1-A-BinaryNDCGAlign040:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: binary, target_alignment: 0.40, final_alignment: null, exploration_schedule: fixed}
  G1-A-BinaryNDCGAlign065:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: binary, target_alignment: 0.65, final_alignment: null, exploration_schedule: fixed}
  G1-A-BinaryNDCGAlign080:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: binary, target_alignment: 0.80, final_alignment: null, exploration_schedule: fixed}
  G1-A-BinaryNDCGAlign090:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: binary, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed}
  G1-A-BinaryNDCGAlign095:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: binary, target_alignment: 0.95, final_alignment: null, exploration_schedule: fixed}
  G1-A-NDCGAlign040:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: graded, target_alignment: 0.40, final_alignment: null, exploration_schedule: fixed}
  G1-A-NDCGAlign065:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: graded, target_alignment: 0.65, final_alignment: null, exploration_schedule: fixed}
  G1-A-NDCGAlign090:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: graded, target_alignment: 0.90, final_alignment: null, exploration_schedule: fixed}
  G1-A-NDCGAlign095:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {reward_type: ndcg_in_batch, relevance_scheme: graded, target_alignment: 0.95, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRAlign040:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRR
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.40, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRAlign065:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRR
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.65, final_alignment: null, exploration_schedule: fixed}
  G1-A-MRRAlign095:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRR
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary, target_alignment: 0.95, final_alignment: null, exploration_schedule: fixed}
  G1-J-RL-MRRSmall:
    group: G1
    objective: rl
    scope: joint
    control: G1-A-MRR
    overrides:
      reward_type: mrr_in_batch
      relevance_scheme: binary
      target_alignment: 0.80
      final_alignment: null
      exploration_schedule: fixed
  G1-J-LL-Scaled:
    group: G1
    objective: lambdaloss
    scope: joint
    control: G1-J-LL
    overrides:
      lambdaloss_sigma: 33.333333333333336
  G1-A-Norm:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {advantage_baseline: leave_one_out, advantage_norm: per_component, document_log_prob_reduction: sum}
  G1-A-DocMean:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {advantage_baseline: leave_one_out, advantage_norm: none, document_log_prob_reduction: mean}
  G1-A-NormDocMean:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {advantage_baseline: leave_one_out, advantage_norm: per_component, document_log_prob_reduction: mean}
  # Paired optional study, anchored to A_1024(755) rather than the rounded 0.53 example.
  # These two recipes are scoped to the current Qwen3-Embedding-0.6B initialization.
  G1-A-Anneal:
    group: G1
    objective: rl
    scope: joint
    priority: optional
    control: G1-J-RL
    overrides:
      target_alignment: 0.5302373892742263
      final_alignment: 0.80
      exploration_schedule: linear
  G1-A-FixedSmall:
    group: G1
    objective: rl
    scope: joint
    priority: optional
    control: G1-J-RL
    overrides:
      target_alignment: 0.80
      final_alignment: null
      exploration_schedule: fixed
  G1-A-QPolicy:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {action_components: [[query]]}
  G1-A-DPolicy:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {action_components: [[positive, negative]]}
  G1-A-Gaussion:
    priority: optional
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {sampling_law: gaussian}
  G1-A-Binary:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {relevance_scheme: binary}
  G1-A-Paired:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {rollout: diagonal}
  G1-A-Cal:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {frozen_doc_rescale: false}
  G1-A-MRR:
    priority: optional
    group: G1
    objective: rl
    scope: joint
    control: G1-A-Binary
    overrides: {reward_type: mrr_in_batch, relevance_scheme: binary}
  G1-DR:
    group: G1
    objective: rl
    scope: query_only
    control: G1-A-QPolicy
    protocol:
      candidate_access: per_source_dynamic_full_corpus
      retrieval_reward: known_qrels_graded_ndcg_at_10
      unjudged_documents: zero_gain
      document_encoder: frozen_E0_index
    overrides:
      dynamic_retrieval: true
      dynamic_retrieval_k: 20
      frozen_document_index_backend: faiss
      reward_type: ndcg
      reward_terms: ''
      reward_ndcg_k: 10
  G2-D-CL: {group: G2, objective: infonce, scope: joint}
  G2-D-RL:
    group: G2
    objective: rl
    scope: joint
    # Shared only by the six G2 RL rows; CL and historical G1 recipes stay independent.
    # Budget and optimizer settings come from the same G2 profile/settings as CL.
    overrides: &g2_rl_recipe
      reward_type: mrr_in_batch
      reward_terms: ''
      reward_ndcg_k: 10
      relevance_scheme: binary
      ndcg_in_batch_include_negatives: false
      action_components: [[query], [positive, negative]]
      group_size: 32
      sampling_law: vmf
      rollout: product
      target_alignment: 0.90
      final_alignment: null
      exploration_schedule: fixed
      sigma_learnable: false
      advantage_baseline: leave_one_out
      advantage_norm: none
      document_log_prob_reduction: sum
      frozen_doc_rescale: true
      in_batch_use_sampled_documents: false
      kl_coef: 0
  G2-W-CL: {group: G2, objective: infonce, scope: joint, init_from: G2-D-CL}
  G2-E-CL:
    group: G2
    objective: infonce
    scope: joint
    model_config: ../../model/qwen3_embedding_0.6b.yaml
  G2-E-RL:
    group: G2
    objective: rl
    scope: joint
    model_config: ../../model/qwen3_embedding_0.6b.yaml
    overrides: *g2_rl_recipe
  G2-W-RL:
    group: G2
    objective: rl
    scope: joint
    init_from: G2-D-CL
    overrides: *g2_rl_recipe
  G2-BGE-D-CL: {group: G2, dataset: bge_m3, objective: infonce, scope: joint}
  G2-BGE-D-RL: {group: G2, dataset: bge_m3, objective: rl, scope: joint, overrides: *g2_rl_recipe}
  G2-BGE-W-CL: {group: G2, dataset: bge_m3, objective: infonce, scope: joint, init_from: G2-BGE-D-CL}
  G2-BGE-E-CL:
    group: G2
    dataset: bge_m3
    objective: infonce
    scope: joint
    model_config: ../../model/qwen3_embedding_0.6b.yaml
  G2-BGE-E-RL:
    group: G2
    dataset: bge_m3
    objective: rl
    scope: joint
    model_config: ../../model/qwen3_embedding_0.6b.yaml
    overrides: *g2_rl_recipe
  G2-BGE-W-RL:
    group: G2
    dataset: bge_m3
    objective: rl
    scope: joint
    init_from: G2-BGE-D-CL
    overrides: *g2_rl_recipe
  G3-E0: {group: G3, kind: evaluation, scope: reference}
  G3-CL:
    group: G3
    objective: infonce
    scope: query_only
    protocol:
      training_relevance: external_binary_passage_qrels_aligned_to_frozen_corpus
  G3-RetRL-MRR:
    group: G3
    objective: rl
    scope: query_only
    protocol:
      retrieval_reward: binary_mrr_at_10
      retrieval_relevance: external_binary_passage_qrels_aligned_to_frozen_corpus
      unjudged_documents: zero_gain
    overrides: {rag_retrieval_reward: mrr}
  G3-RetRL-NDCG:
    group: G3
    objective: rl
    scope: query_only
    control: G3-RetRL-MRR
    protocol:
      retrieval_reward: binary_ndcg_at_10
      retrieval_relevance: external_binary_passage_qrels_aligned_to_frozen_corpus
      unjudged_documents: zero_gain
    overrides: {rag_retrieval_reward: ndcg}
  G3-AnsRL:
    group: G3
    objective: rl
    scope: query_only
    overrides: {rag_retrieval_reward: answer_f1}
