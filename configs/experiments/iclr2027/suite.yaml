# Experiment contracts, not HfArgumentParser input. Use scripts/experiments/iclr2027.py.
version: 1
plan: paper/EXPERIMENT_PLAN.md
seed: 42
output_root: checkpoints/iclr2027

# Pending implementations are explicit, source-audited blockers. Remove a requirement
# only with its implementation and corresponding validation; there is no bypass flag.
pending:
  manifest_loader: "src/embedding_data.py: shared immutable train/dev/test manifest not implemented"
  deterministic_dev: "Deterministic ranking dev selection/checkpoint evaluation not implemented"
  frozen_document: "Embedding trainers lack a frozen document branch; exploration=query is not query-only training"
  rag_lambdaloss: "RAG LambdaLoss objective not implemented"
  rag_ndcg: "RAG nDCG reward not implemented; source_aware_mrr is not an equivalent substitution"
  rag_candidates: "Shared-candidate objective control must be implemented and validated"
  rag_selection: "Answer-F1 checkpoint selection needs integration with the training schedule"
  continuation: "Common-warm-up data cursor, optimizer reset policy and total-budget handling not integrated"

profiles:
  G1:
    config: g1.yaml
    dataset_manifest: data/processed/reasonrank_simple/manifest.json
    selection: fixed_budget_final_checkpoint
    final_evaluation: [bright, mteb_retrieval_retention]
    requirements: []
    protocol:
      labels: sampled_single_positive_binary
      exclude_sources: [msmarco]
      variable_candidates: true
      positive_selection: per_query_seeded_uniform_once
      positive_selection_seed: 42
      frozen_cross_query_documents: true
      max_steps: null
      learning_rate: null
      eval_steps: null
  G2:
    config: g2.yaml
    dataset_manifest: data/protocols/g2_e2rank.json
    selection: e2rank_dev_teacher_grade_ndcg_at_10
    final_evaluation: [external_retrieval, e2rank_test]
    requirements: [manifest_loader, deterministic_dev]
    protocol:
      labels: teacher_grades_3_2_1_0
      model_name_or_path: null  # A genuine base LLM, not the old Qwen3 instruction checkpoint by assumption.
      pooling_method: null
      append_token: null
      padding_side: null
      query_prompt_template: null
      document_prompt_template: null
      max_steps: null          # T in optimizer steps; also declare/record actual examples/tokens.
      warmup_checkpoint_step: null # W < T; unrelated to scheduler warmup_ratio.
      learning_rate: null
      eval_steps: null
      continuation_optimizer: null
  G3:
    config: g3.yaml
    dataset_manifest: data/protocols/g3_qa.json
    selection: qa_dev_answer_f1
    final_evaluation: [qa_test_answer_f1, qa_test_retrieval]
    requirements: [rag_candidates, rag_selection]
    protocol:
      labels: qa_retrieval_relevance
      candidate_access: shared_candidate_control_plus_dynamic_deployment
      max_steps: null
      learning_rate: null
      eval_steps: null

runs:
  G1-E0: {group: G1, kind: evaluation, scope: reference}
  G1-J-CL: {group: G1, objective: infonce, scope: joint}
  G1-Q-CL: {group: G1, objective: infonce, scope: query_only, requirements: [frozen_document]}
  G1-J-RN: {group: G1, objective: ranknet, scope: joint}
  G1-Q-RN: {group: G1, objective: ranknet, scope: query_only, requirements: [frozen_document]}
  G1-J-LL: {group: G1, objective: lambdaloss, scope: joint}
  G1-Q-LL: {group: G1, objective: lambdaloss, scope: query_only, requirements: [frozen_document]}
  G1-J-RL: {group: G1, objective: rl, scope: joint}
  G1-Q-RL: {group: G1, objective: rl, scope: query_only, requirements: [frozen_document]}
  G1-A-Paired:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {rollout: diagonal}
  G1-A-Cal:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {frozen_doc_rescale: false}
  G1-A-MRR:
    group: G1
    objective: rl
    scope: joint
    control: G1-J-RL
    overrides: {reward_type: mrr_in_batch}
  G2-D-CL: {group: G2, objective: infonce, scope: joint}
  G2-D-LL: {group: G2, objective: lambdaloss, scope: joint}
  G2-D-RL: {group: G2, objective: rl, scope: joint}
  G2-W-CL: {group: G2, kind: reuse, reuse: G2-D-CL, scope: joint}
  G2-W-LL:
    group: G2
    objective: lambdaloss
    scope: joint
    warmup_from: G2-D-CL
    requirements: [continuation]
  G2-W-RL:
    group: G2
    objective: rl
    scope: joint
    warmup_from: G2-D-CL
    requirements: [continuation]
  G3-E0: {group: G3, kind: evaluation, scope: reference}
  G3-CL: {group: G3, objective: infonce, scope: query_only}
  G3-LL: {group: G3, objective: lambdaloss, scope: query_only, requirements: [rag_lambdaloss]}
  G3-RetRL:
    group: G3
    objective: rl
    scope: query_only
    requirements: [rag_ndcg]
    overrides: {rag_retrieval_reward: ndcg}
  G3-AnsRL:
    group: G3
    objective: rl
    scope: query_only
    overrides: {rag_retrieval_reward: answer_f1}
