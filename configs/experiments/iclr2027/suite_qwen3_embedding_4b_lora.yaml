# Qwen3-Embedding-4B LoRA transfer of the paper's Table 1 and three decisive RL ablations.
version: 1
plan: docs/qwen3_embedding_4b_lora.md
seed: 42
output_root: checkpoints/iclr2027-qwen3-embedding-4b-lora
pending: {}

profiles:
  G1:
    config: g1_qwen3_embedding_4b_lora.yaml
    dataset_manifest: data/processed/reasonrank_multi/manifest.json
    selection: fixed_budget_final_checkpoint
    final_evaluation: [bright]
    requirements: []
    protocol:
      labels: teacher_grades_and_original_binary_positives
      sampling: per_source_epoch_shuffle_retained_tail_v1
      training_budget: fixed_steps
      max_steps: 113
      learning_rate: 0.0001
      eval_steps: 25
      global_batch_size: 128
      micro_batch_size: 8
      positive_selection: retain_all_seeded_in_batch_representative
      positive_selection_seed: 42

runs:
  Q4B-LORA-E0:
    group: G1
    kind: evaluation
    scope: reference
    overrides: {lora_enabled: false}

  Q4B-LORA-InfoNCE: &infonce
    group: G1
    scope: joint
    objective: infonce
    seed: 42
    protocol: {labels: all_known_positives_binary}
    overrides:
      relevance_scheme: binary
      baseline_in_batch_include_negatives: true
      baseline_cross_device_negatives: true
      baseline_detach_in_batch_documents: false
  Q4B-LORA-InfoNCE-Seed3407:
    <<: *infonce
    seed: 3407
  Q4B-LORA-InfoNCE-Seed2026:
    <<: *infonce
    seed: 2026

  Q4B-LORA-LambdaLoss: &lambdaloss
    group: G1
    scope: joint
    objective: lambdaloss
    seed: 42
    protocol: {labels: teacher_grades_3_2_1_0}
    overrides:
      relevance_scheme: graded
      lambdaloss_sigma: 33.333333333333336
  Q4B-LORA-LambdaLoss-Seed3407:
    <<: *lambdaloss
    seed: 3407
  Q4B-LORA-LambdaLoss-Seed2026:
    <<: *lambdaloss
    seed: 2026

  Q4B-LORA-RELER: &reler
    group: G1
    scope: joint
    objective: rl
    seed: 42
    protocol: {labels: teacher_grades_and_original_binary_positives}
    overrides: &reler_params
      lora_enabled: true
      relevance_scheme: graded
      reward_type: ndcg_in_batch
      reward_ndcg_k: 10
      ndcg_in_batch_include_negatives: true
      reward_cross_device_negatives: true
      cross_query_document_gradients: false
      action_components: [[query], [positive, negative]]
      sampling_law: vmf
      rollout: product
      rollout_seed: 42
      gradient_estimator: conditional_projection
      group_size: 64
      target_alignment: 0.70
      final_alignment: null
      exploration_schedule: fixed
      sigma_learnable: false
      advantage_baseline: leave_one_out
      advantage_norm: none
      document_advantage_baseline: shared
      document_log_prob_reduction: sum
      frozen_doc_rescale: true
      in_batch_use_sampled_documents: false
      reward_combine: sum
      reward_shortlist_count: 1
      reward_shortlist_size: 7
      reward_shortlist_hard_count: 0
      reward_shortlist_hard_pool_size: 128
      reward_shortlist_pairwise_coef: 0.5
      aux_infonce_coef: 0.0
      kl_coef: 0.0
  Q4B-LORA-RELER-Seed3407:
    <<: *reler
    seed: 3407
    overrides: {<<: *reler_params, rollout_seed: 3407}
  Q4B-LORA-RELER-Seed2026:
    <<: *reler
    seed: 2026
    overrides: {<<: *reler_params, rollout_seed: 2026}

  # Paper main-table follow-up: retain all own candidates and add no
  # cross-query negatives. The learning rate follows the 2e-4 4B
  # calibration; all other RELER settings, including pairwise feedback,
  # are inherited from the matching K=7 seed.
  Q4B-LORA-RELER-K0: &reler_k0
    <<: *reler
    control: Q4B-LORA-RELER
    protocol: {labels: teacher_grades_and_original_binary_positives, learning_rate: 0.0002}
    overrides: &reler_k0_params
      <<: *reler_params
      reward_shortlist_size: 0
  Q4B-LORA-RELER-K0-Seed3407:
    <<: *reler_k0
    seed: 3407
    control: Q4B-LORA-RELER-Seed3407
    overrides: {<<: *reler_k0_params, rollout_seed: 3407}
  Q4B-LORA-RELER-K0-Seed2026:
    <<: *reler_k0
    seed: 2026
    control: Q4B-LORA-RELER-Seed2026
    overrides: {<<: *reler_k0_params, rollout_seed: 2026}

  Q4B-LORA-RELER-NoPairwise-CP: &no_pairwise_cp
    <<: *reler
    control: Q4B-LORA-RELER
    overrides: &no_pairwise_cp_params
      <<: *reler_params
      reward_shortlist_pairwise_coef: 0.0
  Q4B-LORA-RELER-NoPairwise-CP-Seed3407:
    <<: *no_pairwise_cp
    seed: 3407
    control: Q4B-LORA-RELER-Seed3407
    overrides: {<<: *no_pairwise_cp_params, rollout_seed: 3407}
  Q4B-LORA-RELER-NoPairwise-CP-Seed2026:
    <<: *no_pairwise_cp
    seed: 2026
    control: Q4B-LORA-RELER-Seed2026
    overrides: {<<: *no_pairwise_cp_params, rollout_seed: 2026}

  Q4B-LORA-RELER-NoPairwise-RLOO: &no_pairwise_rloo
    <<: *no_pairwise_cp
    control: Q4B-LORA-RELER-NoPairwise-CP
    overrides: &no_pairwise_rloo_params
      <<: *no_pairwise_cp_params
      gradient_estimator: score_function
  Q4B-LORA-RELER-NoPairwise-RLOO-Seed3407:
    <<: *no_pairwise_rloo
    seed: 3407
    control: Q4B-LORA-RELER-NoPairwise-CP-Seed3407
    overrides: {<<: *no_pairwise_rloo_params, rollout_seed: 3407}
  Q4B-LORA-RELER-NoPairwise-RLOO-Seed2026:
    <<: *no_pairwise_rloo
    seed: 2026
    control: Q4B-LORA-RELER-NoPairwise-CP-Seed2026
    overrides: {<<: *no_pairwise_rloo_params, rollout_seed: 2026}

  Q4B-LORA-RELER-NoRescale: &no_rescale
    <<: *reler
    control: Q4B-LORA-RELER
    overrides: &no_rescale_params
      <<: *reler_params
      frozen_doc_rescale: false
  Q4B-LORA-RELER-NoRescale-Seed3407:
    <<: *no_rescale
    seed: 3407
    control: Q4B-LORA-RELER-Seed3407
    overrides: {<<: *no_rescale_params, rollout_seed: 3407}
  Q4B-LORA-RELER-NoRescale-Seed2026:
    <<: *no_rescale
    seed: 2026
    control: Q4B-LORA-RELER-Seed2026
    overrides: {<<: *no_rescale_params, rollout_seed: 2026}
