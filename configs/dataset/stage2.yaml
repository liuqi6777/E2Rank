# Stage 2 (ranking RL) with a graded label scheme. Note: BGE-M3 mined negatives have no
# true multi-level relevance, so "graded" here assigns positional grades to the sorted
# negatives (higher neg_scores -> higher positional grade). Prefer stage2_binary.yaml
# unless you specifically want the graded ablation.
_base_:
  - ./default.yaml
per_dataset_max_samples: 10000
relevance_scheme: graded
# Held-out dev split for model selection, disjoint from training and stable per --seed.
dev_samples_per_source: 200
