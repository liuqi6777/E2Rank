# Common settings for the paper experiments. Internal objectives/masks stay in presets.
# Batch settings target one 8 x 80GB node: microbatch 16 on each worker and no
# gradient accumulation for the default 8-GPU launch.
output_dir: checkpoints/iclr2027

G1:
  data: data/processed/reasonrank_multi
  model: Qwen/Qwen3-Embedding-0.6B
  learning_rate: 0.000005
  # 113 * 128 = 14,464 query exposures, matching the former 450 * 32 budget.
  steps: 113
  checkpoint_every: 25
  batch_size: 128
  micro_batch_size: 16

G2:
  data: data
  bge_m3_data: /mnt/tidal-alsh-share2/dataset/liuqi18/datasets/bge-m3-data
  model: Qwen/Qwen3-0.6B
  learning_rate: 0.000005
  steps: 1200
  checkpoint_every: 200
  batch_size: 128
  micro_batch_size: 16

G3:
  model: Qwen/Qwen3-Embedding-0.6B
  learning_rate: 0.000005
  # 200 * 128 = 25,600 query exposures, about a quarter of the 108,730 prepared
  # queries. The budget is set by G3-AnsRL, not by the data: its reward asks the
  # generator once per rollout, so every step costs batch x rag_group_size =
  # 4,096 generations on the single frozen endpoint. All four G3 runs share this
  # budget because they are compared at their final checkpoint.
  steps: 200
  checkpoint_every: 40
  batch_size: 128
  micro_batch_size: 16
