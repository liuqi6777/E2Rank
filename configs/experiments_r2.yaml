  # Absolute paths are supported; relative paths are based on the project root.
  # Copy G1.data from the old settings if that machine uses a custom location.
  data: data/processed/reasonrank_multi
  model: Qwen/Qwen3-Embedding-0.6B
  learning_rate: 0.000005
  steps: 113
  checkpoint_every: 25
  batch_size: 128
  micro_batch_size: 16
