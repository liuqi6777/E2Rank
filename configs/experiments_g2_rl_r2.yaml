# Share the paired CL root so init_from resolves the existing new-protocol W0.
# RL run IDs have their own output/launch directories; CL is never scheduled here.
output_dir: checkpoints/iclr2027-g2-cl-r2
G2:
  data: data
  model: Qwen/Qwen3-0.6B
  learning_rate: 0.000005
  steps: 1200
  checkpoint_every: 200
  batch_size: 128
  micro_batch_size: 16
